[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fodw"
version = "0.1.0"
description = "Bot modular de música para Discord"
requires-python = ">=3.11"
dependencies = ["discord.py[voice]==2.7.1", "yt-dlp[default]==2026.8.19", "python-dotenv>=1.1,<2"]

[project.scripts]
fodw = "fodw.__main__:main"

[tool.setuptools.packages.find]
include = ["fodw*"]
